# Publishes the documentation site to GitHub Pages.
#
# The repository is public and Pages is enabled with "GitHub Actions" as the
# source, so this runs on every push to main. The custom domain comes from
# docs/public/CNAME, which VitePress copies into the published output.
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The live demos on the component pages are a Volt application, compiled
      # by the plugin and drawn with the styled layer's stylesheet, so the
      # packages have to be built before the site that embeds them is.
      - run: pnpm build
      - run: pnpm docs:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
