name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Before the typecheck, not after. Packages import each other by name,
      # which resolves through `exports` to `dist/*.d.ts` — files that only
      # exist once the package has been built. A working tree has them left
      # over from a previous build; a fresh checkout does not.
      - name: Build packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      # The template type-checker, run the way an application runs it: through
      # the published `volt` bin, against a real project. Without this step the
      # checker only ever runs for whoever thinks to run it by hand, which is
      # the same as not having it.
      - name: Check templates
        run: pnpm --filter @voltdev/example-counter run check

      - name: Test
        run: pnpm test

      - name: Build example
        run: pnpm --filter @voltdev/example-counter run build

      - name: Build docs
        run: pnpm docs:build
