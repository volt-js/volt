# Publishes the packages to npm with provenance.
#
# Two tools, because neither does the whole job. `pnpm pack` rewrites the
# `workspace:*` dependency ranges into real versions — publishing with npm
# directly would ship the protocol string and break every install. `npm publish`
# is what attests provenance. So each package is packed by pnpm and the tarball
# handed to npm.
#
# Provenance links a published version to the exact commit and workflow run that
# built it, and npm shows it as a verified badge. It needs `id-token: write`,
# and it needs the `repository` field in package.json to match this repository —
# both are set.
#
# Authentication is whichever of two is available. The first publish of a
# package needed NPM_TOKEN, because a trusted publisher can only be configured
# on npmjs.com once the package exists. Once each package names this workflow
# as its publisher, deleting the secret is the entire switch — the step below
# writes an auth line only when a token is present, and otherwise lets npm
# exchange this run's OIDC identity for a short-lived credential.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and check everything, publish nothing
        type: boolean
        default: true
      dist_tag:
        description: Registry tag to publish under
        type: choice
        default: alpha
        options: [alpha, next, latest]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Nothing ships that has not passed everything CI runs. A bad version
      # cannot be taken back: npm only allows unpublishing within 72 hours,
      # and never once anything depends on it.
      - name: Build packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          DIST_TAG: ${{ inputs.dist_tag || 'alpha' }}
        run: |
          set -euo pipefail

          # Authenticate only if a token was given. With a trusted publisher
          # configured on npmjs.com, npm exchanges the workflow's OIDC identity
          # for a short-lived credential and needs nothing here — so deleting
          # the NPM_TOKEN secret is the whole switch, with no edit to this file.
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
            echo "== authenticating with NPM_TOKEN"
          else
            echo "== no token; publishing as a trusted publisher over OIDC"
          fi

          # Dependency order. reactivity and compiler stand alone, core needs
          # both, and vite-plugin needs compiler — a package must exist on the
          # registry before something that depends on it is published.
          PACKAGES="reactivity compiler core vite-plugin"

          # Deliberately absent: every other package. Each is built and tested
          # by CI, but a version cannot be taken back (see above), so a package
          # joins this list when it is decided to ship rather than when it
          # compiles. Adding one here means adding it to PUBLISHED_PACKAGES in
          # packages/create-volt/src/versions.ts as well: that list decides which
          # templates create-volt will generate, and a template naming a package
          # npm does not have produces a project that cannot install.

          for pkg in $PACKAGES; do
            cd "$GITHUB_WORKSPACE/packages/$pkg"
            name=$(node -p "require('./package.json').name")
            version=$(node -p "require('./package.json').version")

            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "== $name@$version is already on the registry, skipping"
              continue
            fi

            rm -f ./*.tgz
            pnpm pack >/dev/null
            tarball=$(ls ./*.tgz)

            # The tag is what `npm install @voltdev/core@alpha` resolves.
            # It does not keep a package off `latest` on its first publish —
            # npm points `latest` at the first version regardless of the tag
            # given, and only honours this from the second publish onward.
            if [ "${DRY_RUN:-false}" = "true" ]; then
              echo "== would publish $name@$version under tag ${DIST_TAG}"
              npm publish "$tarball" --provenance --access public --tag "$DIST_TAG" --dry-run
            else
              echo "== publishing $name@$version under tag ${DIST_TAG}"
              npm publish "$tarball" --provenance --access public --tag "$DIST_TAG"
            fi
            rm -f "$tarball"
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "### Packages"
            for pkg in reactivity compiler core vite-plugin; do
              name=$(node -p "require('$GITHUB_WORKSPACE/packages/$pkg/package.json').name")
              version=$(node -p "require('$GITHUB_WORKSPACE/packages/$pkg/package.json').version")
              echo "- \`$name@$version\`"
            done
            echo ""
            echo "Published under tag \`${DIST_TAG:-alpha}\`. Install with \`@alpha\`."
            echo ""
            echo "Held back: primitives, ui, grid, editor."
          } >> "$GITHUB_STEP_SUMMARY"
