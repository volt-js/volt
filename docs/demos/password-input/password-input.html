<form class="form" :submit="signIn($event)">
  <v-input
    :value="email"
    label="Email"
    name="email"
    type="email"
    autoComplete="email"
    placeholder="ada@example.com"
    required
  ></v-input>

  <v-password-input
    :value="password"
    label="Password"
    name="password"
    required
    :prop-error="refused.get()"
  >
    <template :slot-description>Try <code>correct horse</code>.</template>
  </v-password-input>

  <div class="row">
    <v-button type="submit" variant="primary">Sign in</v-button>
    <span class="note">{ result.get() }</span>
  </div>
</form>

<form class="form">
  <v-password-input
    :value="chosen"
    label="Choose a new password"
    name="new-password"
    autoComplete="new-password"
    description="Eight characters or more."
    :minLength="8"
    validateOn="blur"
  >
    <template :slot-toggle="{ revealed }">
      <span class="icon" aria-hidden="true">
        <svg :if="!revealed" class="eye" viewBox="0 0 24 24">
          <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
          <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2" />
        </svg>
        <svg :else class="eye" viewBox="0 0 24 24">
          <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
          <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2" />
          <path d="M4 20 20 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </span>
    </template>
  </v-password-input>
</form>
