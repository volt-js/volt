<div
  :host
  :ref="group"
  class="volt-rating"
  :spread="groupProps()"
  :keydown="rating.onKeyDown($event)"
  :pointerleave="rating.preview(null)"
>
  <span :for="star in stars" :key="star.at" class="volt-rating-star">
    <span
      :for="value in star.values"
      :key="value"
      class="volt-rating-item"
      :spread="itemProps(value)"
      :click="rating.setValue(value)"
      :pointerenter="rating.preview(value)"
    >
      <span class="volt-rating-icon" aria-hidden="true"><slot
        name="icon"
        :value="value"
        :filled="rating.isFilled(value)"
      ><svg viewBox="0 0 24 24" width="100%" height="100%"><path d="M12 2.5l2.94 6.28 6.86.84-5.06 4.74 1.32 6.8L12 17.77l-6.06 3.39 1.32-6.8L2.2 9.62l6.86-.84z"></path></svg></slot></span>
    </span>
  </span>

  <input :for="value in values" :key="value" :spread="rating.inputProps(value)">
</div>
