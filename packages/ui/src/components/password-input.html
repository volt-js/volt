<div class="volt-field" :spread="password.fieldProps()">
  <label class="volt-field-label" :ref="labelEl" :spread="password.labelProps()"><slot name="label">{ label.get() }</slot></label>

  <div class="volt-password-input">
    <input :host class="volt-field-control" :ref="control" :spread="inputProps()">
    <button
      class="volt-password-input-toggle"
      :disabled="disabled.get()"
      :spread="password.toggleProps()"
      :click="password.toggle()"
    ><slot name="toggle" :revealed="password.isRevealed()">{ words() }</slot></button>
  </div>

  <p class="volt-field-description" :ref="descriptionEl" :spread="password.descriptionProps()"><slot name="description">{ description.get() }</slot></p>

  <p class="volt-field-error" :ref="errorEl" :spread="password.errorMessageProps()">{ message() }</p>

  <p class="volt-password-input-status" :spread="password.statusProps()">{ password.statusText() }</p>
</div>
